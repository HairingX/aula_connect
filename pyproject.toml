[build-system]
# The version comes from the git tag (setuptools-scm), not from a file: a release never commits it.
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aula_connect"
dynamic = ["version"]
description = "Client for the Danish school platform Aula: MitID login, and the children's profiles, calendars, messages, notifications and weekly plans as typed models."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "HairingX" }]
keywords = ["aula", "mitid", "school", "denmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "aiohttp>=3.9.0",
    "mitid_connect>=0.0.2.dev0",
]

[project.urls]
Homepage = "https://github.com/HairingX/aula_connect"
Source = "https://github.com/HairingX/aula_connect"
Issues = "https://github.com/HairingX/aula_connect/issues"
Releases = "https://github.com/HairingX/aula_connect/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aula_connect = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: talks to a real Aula account; skipped unless one is configured. Exclude with -m \"not live\".",
]

[tool.pyright]
# The standard belongs to the repository, not to a personal editor setting: an IDE and a CI
# run must agree on what counts as an error.
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
enableTypeIgnoreComments = false

[[tool.pyright.executionEnvironments]]
# Tests import the installed package, as its users do, and reach into its parts.
root = "tests"
reportPrivateUsage = "none"

[tool.hairingx-workflows]
libraries = ["mitid_connect"]
